[[packages]]
name = "modemmanager"
# 1.20.6-2 is the highest Debian-packaged release that still builds on
# bookworm (the base distro of the vyos-build container).  It exposes
# org.freedesktop.ModemManager1.Modem.CellInfo (band / EARFCN / PCI /
# RSRP / RSRQ / SINR) over D-Bus with the QMI plugin fixes from the
# 1.20.x stable branch.
#
# Newer Debian releases push the build-dep wall past bookworm:
#   1.22.x  : debhelper >= 13.11.6, libqmi-glib-dev >= 1.34,
#             libmbim-glib-dev >= 1.30, systemd-dev (trixie-only pkg)
#   1.23.x+ : libqmi-glib-dev >= 1.35.6, dh-sequence-gir
#   1.24.x  : libqmi-glib-dev >= 1.36, libmbim-glib-dev >= 1.32
# None of those are in bookworm, so mk-build-deps fails.
#
# If CellInfo on 1.20.6-2 doesn't surface the band you need, fall back
# to the AT-passthrough patch (Modem.Command -> AT+QCAINFO / AT!GBAND?)
# or call qmicli --nas-get-rf-band-info directly from the FSM.  Stay on
# 1.20.6-2 until the build container moves to trixie.
commit_id = "debian/1.20.6-2"
scm_url = "https://salsa.debian.org/DebianOnMobile-team/modemmanager.git"

apply_patches = false

build_cmd = '''
# Apply local patches: those that modify files under debian/ are applied
# directly (since the 3.0 (quilt) source format expects quilt patches to
# touch upstream only); everything else is registered in the quilt series.
for p in ../patches/*.patch; do
    [ -e "$p" ] || continue
    name="$(basename "$p")"
    if grep -qE '^\+\+\+ [ab]?/?debian/' "$p"; then
        patch -p1 --no-backup-if-mismatch < "$p"
    else
        cp "$p" debian/patches/
        echo "$name" >> debian/patches/series
    fi
done

dpkg-buildpackage -uc -us -tc -b
'''
