[[packages]]
name = "modemmanager"
# 1.24.2-2 is the latest stable Debian-packaged release.  It adds
# org.freedesktop.ModemManager1.Modem.CellInfo (introduced in 1.20, hardened
# in 1.22) which lets the FSM read the *active* serving band/EARFCN over
# D-Bus, removing the need to spawn qmicli for that information.  Build
# dependencies are unchanged from 1.20.4-1.
commit_id = "debian/1.24.2-2"
scm_url = "https://salsa.debian.org/DebianOnMobile-team/modemmanager.git"

apply_patches = false

build_cmd = '''
# Apply local patches: those that modify files under debian/ are applied
# directly (since the 3.0 (quilt) source format expects quilt patches to
# touch upstream only); everything else is registered in the quilt series.
for p in ../patches/*.patch; do
    [ -e "$p" ] || continue
    name="$(basename "$p")"
    if grep -qE '^\+\+\+ [ab]?/?debian/' "$p"; then
        patch -p1 --no-backup-if-mismatch < "$p"
    else
        cp "$p" debian/patches/
        echo "$name" >> debian/patches/series
    fi
done

dpkg-buildpackage -uc -us -tc -b
'''
