[[packages]]
name = "libtacplus-map"
commit_id = "master"
scm_url = "https://github.com/psleng/libtacplus-map.git"
build_cmd = "dpkg-buildpackage -us -uc -tc -b"
upstream_branch = "master"

[[packages]]
name = "libpam-tacplus"
commit_id = "master"
scm_url = "https://github.com/psleng/libpam-tacplus.git"
build_cmd = "sudo dpkg -i ../libtacplus-map*.deb; dpkg-buildpackage -us -uc -tc -b"
upstream_branch = "master"

[[packages]]
name = "libnss-tacplus"
commit_id = "master"
scm_url = "https://github.com/psleng/libnss-tacplus.git"
build_cmd = "sudo dpkg -i ../libtac*.deb ../libpam-tacplus*.deb; dpkg-buildpackage -us -uc -tc -b"
upstream_branch = "master"

[dependencies]
packages = [
    "libpam-dev",
    "libssl-dev",
    "autoconf-archive",
    "libaudit-dev"
]
